# Local dev/testing: both services together on one Docker network. On Fly.io
# these deploy as two separate apps talking over Fly's private network
# instead (see README.md) — compose is for running this on your own machine
# to verify it end-to-end before deploying anywhere.
services:
  potoken-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.2-node
    restart: unless-stopped
    ports:
      - "4416:4416"

  extractor:
    build: .
    restart: unless-stopped
    depends_on:
      - potoken-provider
    environment:
      PORT: "8080"
      EXTRACTOR_SHARED_SECRET: ${EXTRACTOR_SHARED_SECRET:?set EXTRACTOR_SHARED_SECRET in .env}
      POTOKEN_PROVIDER_URL: http://potoken-provider:4416
    ports:
      - "8080:8080"
