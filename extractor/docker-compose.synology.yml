# Production deploy for a Synology (or any always-on Docker host on your
# home network). Adds a Cloudflare Tunnel sidecar in front of the
# extractor so outbound YouTube requests go out over your home's
# residential IP instead of a datacenter IP — Fly.io's IPs turned out to
# get flagged by YouTube's bot detection regardless of a correctly-scoped
# PO token; a residential IP is much less likely to be pre-flagged.
#
# We tried Tailscale Funnel first (see git history) — its registration
# handshake failed identically ("invalid key: unable to validate API key")
# across every configuration variation on this particular Synology
# (userspace/kernel networking, shared/standalone network namespace,
# IPv4-only), despite the exact same key registering cleanly from two
# other machines. Cloudflare Tunnel uses a much simpler connection model
# (a plain outbound HTTPS/QUIC connection with a bearer token, no
# WireGuard/registration handshake, no NET_ADMIN/tun device needed at
# all), which sidesteps whatever that was.
#
# Setup (see README.md for the full walkthrough):
#   1. In the Cloudflare Zero Trust dashboard, create a tunnel and copy its
#      token: https://one.dash.cloudflare.com/ -> Networks -> Tunnels
#   2. In that same tunnel's "Public Hostname" tab, route a subdomain (e.g.
#      videojam-extractor.controlaltdeleted.com) to http://extractor:8080
#   3. cp .env.example .env, fill in EXTRACTOR_SHARED_SECRET and
#      CLOUDFLARE_TUNNEL_TOKEN
#   4. docker-compose -f docker-compose.synology.yml up -d --build
services:
  potoken-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.2-node
    restart: unless-stopped

  extractor:
    build: .
    restart: unless-stopped
    depends_on:
      - potoken-provider
    environment:
      PORT: "8080"
      EXTRACTOR_SHARED_SECRET: ${EXTRACTOR_SHARED_SECRET:?set EXTRACTOR_SHARED_SECRET in .env}
      POTOKEN_PROVIDER_URL: http://potoken-provider:4416
      # Must be the public hostname you routed in the Cloudflare Tunnel's
      # Public Hostname tab — used to build the /stream proxy URL handed
      # back to the tvOS app (see server.ts for why we proxy instead of
      # returning the raw googlevideo URL).
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL in .env, e.g. https://videojam-extractor.controlaltdeleted.com}
    # No published ports here on purpose — only reachable from other
    # containers on this compose network (e.g. cloudflared, at
    # "extractor:8080"), not exposed to your LAN/router at all.

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env — create a tunnel at https://one.dash.cloudflare.com/}
    depends_on:
      - extractor
