# Production deploy for a Synology (or any always-on Docker host on your
# home network). Adds a Tailscale sidecar in front of the extractor so
# outbound YouTube requests go out over your home's residential IP instead
# of a datacenter IP — Fly.io's IPs turned out to get flagged by YouTube's
# bot detection regardless of a correctly-scoped PO token; a residential IP
# is much less likely to be pre-flagged.
#
# Setup (see README.md for the full walkthrough):
#   1. Generate a reusable, non-ephemeral Tailscale auth key:
#      https://login.tailscale.com/admin/settings/keys
#   2. cp .env.example .env, fill in EXTRACTOR_SHARED_SECRET and TS_AUTHKEY
#   3. docker compose -f docker-compose.synology.yml up -d --build
#   4. One-time: docker compose -f docker-compose.synology.yml exec tailscale tailscale funnel 8080
#      (persists in the tailscale state volume — no need to repeat after restarts)
#   5. Find your public URL: docker compose -f docker-compose.synology.yml exec tailscale tailscale funnel status
services:
  potoken-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.2-node
    restart: unless-stopped

  extractor:
    build: .
    restart: unless-stopped
    depends_on:
      - potoken-provider
    environment:
      PORT: "8080"
      EXTRACTOR_SHARED_SECRET: ${EXTRACTOR_SHARED_SECRET:?set EXTRACTOR_SHARED_SECRET in .env}
      POTOKEN_PROVIDER_URL: http://potoken-provider:4416
    # No published ports here on purpose — only reachable from the tailscale
    # sidecar, which shares this container's network namespace below.

  tailscale:
    image: tailscale/tailscale:latest
    restart: unless-stopped
    # Shares extractor's network namespace so "tailscale funnel 8080" can
    # reach the extractor at localhost:8080 without publishing that port to
    # your LAN/router at all.
    network_mode: service:extractor
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?set TS_AUTHKEY in .env — generate at https://login.tailscale.com/admin/settings/keys}
      TS_HOSTNAME: videojam-extractor
      TS_STATE_DIR: /var/lib/tailscale
      # Switched from TS_USERSPACE=true to real kernel networking — on one
      # particular Synology setup, userspace mode's registration handshake
      # to Tailscale's control server failed with "invalid key" even with a
      # confirmed-valid key (tested working fine from a separate machine).
      # Kernel networking is Tailscale's normal/default mode; if Synology's
      # Container Manager doesn't allow NET_ADMIN/tun, this will fail
      # loudly and differently, which at least tells us something new.
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - tailscale-state:/var/lib/tailscale
    depends_on:
      - extractor

volumes:
  tailscale-state:
